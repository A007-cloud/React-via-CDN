<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react via CDN</title>
    <!-- 1. Load React and ReactDOM Core Libraries -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <!-- 2. Load Babel to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone@7.10.3/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      function MyComponent() {
        return (
          <div style={{ fontFamily: "sans-serif", padding: "20px" }}>
            <h1>Hello from React CDN!</h1>
            <p>This page is running entirely without a build step.</p>
          </div>
        );
      }

      //Render the component into DOM
      const container = document.getElementById("root");
      const root = ReactDOM.createRoot(container);
      root.render(<MyComponent />);
    </script>
  </body>
</html>
